<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRMhub</title><link rel="stylesheet" href="style.css"></head>
<body data-page="video"><div id="hdr"></div>
<main class="w"><div class="vl"><div>
<div id="player"></div>
<h1 id="vt" style="font-size:18px">Loading…</h1>
<div class="row"><small id="meta" style="font-size:13px"></small>
<span><button class="btn" id="lk">👍</button> <button class="btn" id="dk">👎</button></span></div>
<div class="row"><a class="up" id="ul" href="#"><div class="av" id="av">?</div><b id="un">@—</b></a><button class="btn main" id="fb">+ Follow</button></div>
<div class="box" id="cat"></div>
<h2 style="font-size:16px">All Comments (<span id="cc">0</span>)</h2>
<form class="cf box" id="cf">
<input id="cn" placeholder="Name (optional - defaults to Anonymous Traveler)" maxlength="60">
<textarea id="cm" placeholder="Say something about this trip…" maxlength="1000" required></textarea>
<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn main">Post comment</button>
<small style="display:block;margin-top:8px">Comments are saved only in your own browser for now.</small></form>
<div id="cl"></div></div>
<aside class="side"><h2 style="font-size:16px;margin-top:0">Up next</h2><div id="next"></div></aside></div></main>
<div id="ftr"></div><script src="config.js"></script><script src="site.js"></script></body></html>
